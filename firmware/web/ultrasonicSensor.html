<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Ultrasonic Sensor Live Value</title>
		<link rel="stylesheet" href="stylesheet.css">
	</head>
	<body>
		<div class="container">
			<h1>Ultrasonic Sensor</h1>
			<div class="card">
				<p>Live distance readings from the HC-SR04 ultrasonic sensor (about 16 measurements a second).</p>
				<div class="graph-controls">
					<label for="ultrasonicTimeWindowSec">Time window (s)</label>
					<input id="ultrasonicTimeWindowSec" class="time-window-input" type="text" value="60" inputmode="numeric" aria-label="Time window in seconds">
				</div>
				<div class="graph-actions">
					<button id="pauseGraphButton" class="btn" type="button">Pause graph</button>
				</div>
				<div class="value-panel">
					<span id="ultrasonicDistanceValue" class="value-number">--</span>
					<span class="value-unit">mm</span>
				</div>
				<div class="graph-card">
					<canvas id="historyCanvas" class="history-canvas" aria-label="Ultrasonic sensor distance history graph"></canvas>
					<div id="graphCaption" class="graph-caption">Time axis: -60 to 0 s. Distance axis auto-scales (mm).</div>
				</div>
				<div id="wsStatus" class="status">Connecting...</div>
				<a href="./" class="btn">Back to control panel</a>
			</div>
		</div>
		<script type="module" src="ultrasonicSensor.js"></script>
	</body>
</html>
