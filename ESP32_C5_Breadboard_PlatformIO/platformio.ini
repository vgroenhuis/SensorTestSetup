; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32c5-display]
platform = https://github.com/pioarduino/platform-espressif32.git
framework = arduino
board = esp32-c5-devkitc1-n16r4
board_build.filesystem = littlefs
board_build.partitions = partitions-16M.csv
board_build.flash_size = 16MB
upload_speed = 921600
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	esp32async/ESPAsyncWebServer @ ^3.9.4
	vgroenhuis/roaming-wifi-manager @ ^0.4.1
	adafruit/Adafruit SSD1306 @ ^2.5.17
	robtillaart/MCP23017@^0.9.3
    robtillaart/MCP_ADC@^0.5.2
    robtillaart/TCA9548@^0.3.0 ; I2C multiplexer
    robtillaart/AS5600@^0.6.6 ; Magnetic rotary encoder for Ferris wheels
    stm32duino/STM32duino VL53L7CX@^1.0.3 ; ToF grid sensor
    robtillaart/PCA9685@^0.7.3 ; PWM/servo control
build_flags = 
	-D RED_GREEN_REVERSED ; for WaveShare ESP32-C5-DevKitC-1
    -D ASYNCWEBSERVER_REGEX
; board_build.sdkconfig = sdkconfig.defaults ; is not used