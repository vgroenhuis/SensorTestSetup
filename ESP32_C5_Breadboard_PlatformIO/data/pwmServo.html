<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>PWM Servo Control</title>
		<link rel="stylesheet" href="/stylesheet.css">
	</head>
	<body>
		<div class="container">
			<h1>PCA9685 Servo Control</h1>
			<div class="card">
				<div class="graph-controls">
					<label for="servoChannel">Channel (0–15)</label>
					<input id="servoChannel" class="time-window-input" type="number" min="0" max="15" value="0" inputmode="numeric" aria-label="Servo channel">
				</div>
				<div id="servoMicrosecondsPanel">
					<div class="graph-controls">
						<label for="servoPulseUs">Pulse width (microseconds)</label>
						<input id="servoPulseUs" class="time-window-input" type="text" value="1500" inputmode="numeric" aria-label="Servo pulse width in microseconds">
					</div>
					<div class="graph-actions">
						<button id="setServoButton" class="btn" type="button">Set servo</button>
						<button id="setAsMinButton" class="btn" type="button">Set as min</button>
						<button id="setAsMaxButton" class="btn" type="button">Set as max</button>
					</div>
				</div>
				<div id="rawPwmPanel">
					<div class="graph-controls">
						<label for="rawPwmSlider">Duty cycle: <span id="rawPwmValueDisplay">0.50</span></label>
						<input id="rawPwmSlider" type="range" min="0" max="1" step="0.01" value="0.5" style="width:100%">
					</div>
					<div class="graph-actions">
						<button id="applyRawPwmButton" class="btn" type="button">Apply duty cycle</button>
						<label style="display:inline-flex;align-items:center;gap:6px;margin-left:12px;">
							<input id="autoUpdateCheckbox" type="checkbox"> Auto update
						</label>
					</div>
				</div>

				<hr style="margin: 20px 0; border: 1px solid #ddd;">

				<div id="channelConfigPanel">
					<div class="graph-controls">
						<label for="configMode">Mode</label>
						<select id="configMode" class="time-window-input" aria-label="Channel mode">
							<option value="servo">Servo</option>
							<option value="raw_pwm">Raw PWM</option>
						</select>
					</div>

					<div id="servoCalibrationPanel">
						<div class="graph-controls">
							<label for="configMinPulse">Min Pulse (μs)</label>
							<input id="configMinPulse" class="time-window-input" type="text" value="500" inputmode="numeric" aria-label="Minimum pulse width in microseconds">
						</div>
						<div class="graph-controls">
							<label for="configMaxPulse">Max Pulse (μs)</label>
							<input id="configMaxPulse" class="time-window-input" type="text" value="2500" inputmode="numeric" aria-label="Maximum pulse width in microseconds">
						</div>
					</div>

					<div class="graph-actions">
						<button id="saveChannelConfigButton" class="btn" type="button">Save Channel Config</button>
						<label style="display:inline-flex;align-items:center;gap:6px;margin-left:12px;">
							<input id="autoSaveCheckbox" type="checkbox"> Auto-save
						</label>
					</div>
				</div>

				<hr style="margin: 20px 0; border: 1px solid #ddd;">

				<div class="graph-controls">
					<label for="pwmFrequency">PWM Frequency (Hz)</label>
					<input id="pwmFrequency" class="time-window-input" type="text" value="50" inputmode="numeric" aria-label="PWM frequency in Hz">
					<small style="display: block; margin-top: 5px; color: #666;">Recommended: 50 Hz for hobby servos (24-1000 Hz)</small>
				</div>
				<div class="graph-actions">
					<button id="setPwmFrequencyButton" class="btn" type="button">Set frequency</button>
				</div>

				<div id="servoStatus" class="status">Ready.</div>
			</div>
			<a href="/" class="btn">Back to control panel</a>
		</div>
		<script type="module" src="/pwmServo.ts"></script>
	</body>
</html>
