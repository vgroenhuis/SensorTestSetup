<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Vincent office: Breadboard ESP32 Control Panel</title>
        <link rel="stylesheet" href="/stylesheet.css">
    </head>
    <body>
        <div class="container">
            <h1>Vincent's ESP32 Control Panel</h1>

            <!-- WiFi Card - Copy this structure to add more sections -->
            <div class="card">
                <a href="/wifi" class="btn">Open WiFi Manager</a> $AUTH_INFO$
            </div>

            <div class="card">
                <a href="/potentiometer" class="btn">Potentiometer</a> 
                Read out the potentiometer connected to pin A4.
            </div>

            <div class="card">
                <a href="/dcMotor" class="btn">DC motor</a>
                Control the DC motor connected to the first port of the L298N.
            </div>

            <div class="card">
                <a href="/serialSettings" class="btn">Manage serial monitor</a>
            </div>

            <div class="footer">
                Vincent office: Breadboard ESP32-C5 Device
            </div>
        </div>
    </body>
</html>
