<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>MCP23017 Bank B Inputs</title>
		<link rel="stylesheet" href="/stylesheet.css">
	</head>
	<body>
		<div class="container">
			<h1>MCP23017 Bank B Inputs</h1>
			<div class="card">
				<p>Live digital state of MCP23017 input bank B (8 bits).</p>
				<div class="graph-controls">
					<label for="mcp23017TimeWindowSec">Time window (s)</label>
					<input id="mcp23017TimeWindowSec" class="time-window-input" type="text" value="60" inputmode="numeric" aria-label="Time window in seconds">
				</div>
				<div class="graph-actions">
					<button id="pauseGraphButton" class="btn" type="button">Pause graph</button>
				</div>
				<div class="digital-value-panel">
					<div class="digital-main-value">
						<span id="mcp23017HexValue" class="digital-main-number">0x00</span>
						<span id="mcp23017BinaryValue" class="digital-main-binary">00000000</span>
					</div>
				</div>
				<div id="mcp23017BitRows" class="digital-bit-grid" aria-live="polite"></div>
				<div class="graph-card">
					<canvas id="mcp23017HistoryCanvas" class="history-canvas" aria-label="MCP23017 input history graph"></canvas>
					<div id="mcp23017GraphCaption" class="graph-caption">Time axis: -60 to 0 s. Eight lanes (IN7..IN0), each LOW/HIGH.</div>
				</div>
				<div id="mcp23017WsStatus" class="status">Connecting...</div>
				<a href="/" class="btn">Back to control panel</a>
			</div>
		</div>
		<script type="module" src="/mcp23017Inputs.ts"></script>
	</body>
</html>
